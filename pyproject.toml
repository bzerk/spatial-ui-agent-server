[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spatial-ui-agent-server"
version = "0.1.0"
description = "Laptop-local agent and surface server for Rokid demos"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "python-multipart>=0.0.20,<1",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
  "zeroconf>=0.147,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
spatial-agent-server = "spatial_ui_agent_server.cli:main"
spatial-agent-mcp = "spatial_ui_agent_server.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_ui_agent_server"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
